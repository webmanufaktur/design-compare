<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Plakatradar — Jedes Plakat. Ein Pin. Eine Karte.</title>
  <meta name="description" content="Plakatradar: jedes Plakat als Pin auf einer Karte. Für Wahlkampfteams aller Parteien. Kostenlos starten." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    /* Play CDN: do NOT @import "tailwindcss" — the browser build already injects it (double preflight if imported). */
    /* Radius override: rounded-md = 12px (buttons, icon tiles); rounded-lg = 20px (cards, map, menu, CTA). */
    @theme {
      --font-sans: "Inter", system-ui, sans-serif;
      --color-brand: #6D28D9;
      --color-brand-strong: #5B21B6;
      --color-brand-tint: #F5F3FF;
      --color-status-active: #059669;
      --color-status-active-bg: #ECFDF5;
      --color-status-stolen: #DC2626;
      --color-status-stolen-bg: #FEF2F2;
      --color-status-damaged: #D97706;
      --color-status-damaged-bg: #FFFBEB;
      --color-status-reported: #2563EB;
      --color-status-reported-bg: #EFF6FF;
      --color-status-removed: #52525B;
      --color-status-removed-bg: #F4F4F5;
      --shadow-sm: 0 1px 2px rgb(24 24 27 / 0.06);
      --shadow-md: 0 4px 12px rgb(24 24 27 / 0.08);
      --shadow-lg: 0 12px 32px rgb(24 24 27 / 0.12);
      --radius-sm: 6px;
      --radius-md: 12px;
      --radius-lg: 20px;
      --radius-pill: 9999px;
    }
  </style>
  <style>
    :root {
      --color-brand: #6D28D9;
      --color-brand-strong: #5B21B6;
      --color-brand-tint: #F5F3FF;
      --color-zinc-50: #FAFAFA;
      --color-zinc-100: #F4F4F5;
      --color-zinc-200: #E4E4E7;
      --color-zinc-300: #D4D4D8;
      --color-zinc-400: #A1A1AA;
      --color-zinc-500: #71717A;
      --color-zinc-600: #52525B;
      --color-zinc-700: #3F3F46;
      --color-zinc-800: #27272A;
      --color-zinc-900: #18181B;
      --color-status-active: #059669;
      --color-status-active-bg: #ECFDF5;
      --color-status-stolen: #DC2626;
      --color-status-stolen-bg: #FEF2F2;
      --color-status-damaged: #D97706;
      --color-status-damaged-bg: #FFFBEB;
      --color-status-reported: #2563EB;
      --color-status-reported-bg: #EFF6FF;
      --color-status-removed: #52525B;
      --color-status-removed-bg: #F4F4F5;
      --pin-1: #DC2626;
      --pin-2: #EA580C;
      --pin-3: #CA8A04;
      --pin-4: #16A34A;
      --pin-5: #0D9488;
      --pin-6: #2563EB;
      --pin-7: #7C3AED;
      --pin-8: #DB2777;
      --radius-sm: 6px;
      --radius-md: 12px;
      --radius-lg: 20px;
      --radius-pill: 9999px;
      --shadow-sm: 0 1px 2px rgba(24, 24, 27, 0.06);
      --shadow-md: 0 4px 12px rgba(24, 24, 27, 0.08);
      --shadow-lg: 0 12px 32px rgba(24, 24, 27, 0.12);
      --container-max: 1152px;
      --font-sans: "Inter", system-ui, sans-serif;
    }

    [x-cloak] { display: none !important; }

    html { scroll-behavior: smooth; }

    .skip-link {
      position: absolute;
      left: 1rem;
      top: 1rem;
      z-index: 60; /* header is z-50 */
      padding: 0.75rem 1.5rem;
      border-radius: 12px;
      background: #6D28D9;
      color: #FFFFFF;
      font: 600 1rem/1.2 "Inter", system-ui, sans-serif;
      text-decoration: none;
      transform: translateY(-200%);
    }
    .skip-link:focus,
    .skip-link:focus-visible {
      transform: none;
      outline: 2px solid #6D28D9;
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
      /* Do not set transition: none. Color/border hovers ≤ 200 ms stay. Pulse keyframes die via animation-duration. */
    }
  </style>
  <script>
    window.plakatPage = function () {
      return {
        mobileOpen: false,
        scrolled: false,
        active: "",
        toggle() {
          this.mobileOpen = !this.mobileOpen;
        },
        close() {
          this.mobileOpen = false;
          this.$nextTick(() => {
            if (this.$refs.menuBtn) this.$refs.menuBtn.focus();
          });
        },
        init() {
          const ratios = { stimmen: 0, ablauf: 0, funktionen: 0 };
          const io = new IntersectionObserver(
            (entries) => {
              entries.forEach((e) => {
                ratios[e.target.id] = e.isIntersecting ? e.intersectionRatio : 0;
              });
              let id = "";
              let best = 0;
              for (const key of ["stimmen", "ablauf", "funktionen"]) {
                if (ratios[key] > best) {
                  best = ratios[key];
                  id = key;
                }
              }
              this.active = best > 0 ? id : "";
            },
            { rootMargin: "-35% 0px -55% 0px", threshold: [0, 0.25, 0.5, 1] }
          );
          ["stimmen", "ablauf", "funktionen"].forEach((id) => {
            const el = document.getElementById(id);
            if (el) io.observe(el);
          });
        },
      };
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>
</head>
<body
  class="bg-white font-sans text-base text-zinc-700 antialiased"
  x-data="plakatPage()"
  @scroll.window.passive="scrolled = window.scrollY > 8"
>
  <a class="skip-link" href="#main">Zum Inhalt springen</a>

  <!-- header -->
  <header id="top">
    <div class="mx-auto w-full max-w-[1152px] px-6 md:px-8">
    </div>
  </header>

  <!-- main -->
  <main id="main">
    <!-- hero -->
    <section id="hero" class="scroll-mt-20 bg-white py-12 md:py-24" aria-labelledby="hero-heading">
      <div class="mx-auto w-full max-w-[1152px] px-6 md:px-8">
        <h2 id="hero-heading">Hero</h2>
      </div>
    </section>

    <!-- stimmen -->
    <section id="stimmen" class="scroll-mt-20 bg-zinc-50 py-12 md:py-16" aria-labelledby="stimmen-heading">
      <div class="mx-auto w-full max-w-[1152px] px-6 md:px-8">
        <h2 id="stimmen-heading">Stimmen</h2>
      </div>
    </section>

    <!-- ablauf -->
    <section id="ablauf" class="scroll-mt-20 bg-white py-12 md:py-24" aria-labelledby="ablauf-heading">
      <div class="mx-auto w-full max-w-[1152px] px-6 md:px-8">
        <h2 id="ablauf-heading">Ablauf</h2>
      </div>
    </section>

    <!-- funktionen -->
    <section id="funktionen" class="scroll-mt-20 bg-white py-12 md:py-24" aria-labelledby="funktionen-heading">
      <div class="mx-auto w-full max-w-[1152px] px-6 md:px-8">
        <h2 id="funktionen-heading">Funktionen</h2>
      </div>
    </section>

    <!-- status -->
    <section id="status" class="scroll-mt-20 bg-white py-12 md:py-24" aria-labelledby="status-heading">
      <div class="mx-auto w-full max-w-[1152px] px-6 md:px-8">
        <h2 id="status-heading">Status</h2>
      </div>
    </section>

    <!-- zahlen -->
    <section id="zahlen" class="scroll-mt-20 bg-zinc-50 py-12 md:py-16" aria-labelledby="zahlen-heading">
      <div class="mx-auto w-full max-w-[1152px] px-6 md:px-8">
        <h2 id="zahlen-heading">Zahlen</h2>
      </div>
    </section>

    <!-- cta -->
    <section id="cta" class="scroll-mt-20 bg-white py-12 md:py-24" aria-labelledby="cta-heading">
      <div class="mx-auto w-full max-w-[1152px] px-6 md:px-8">
        <h2 id="cta-heading">CTA</h2>
      </div>
    </section>
  </main>

  <!-- footer -->
  <footer class="border-t border-zinc-200 bg-zinc-50 py-12 md:py-16">
    <div class="mx-auto w-full max-w-[1152px] px-6 md:px-8">
    </div>
  </footer>
</body>
</html>
